<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Change password | GenQuest</title><link rel="stylesheet" href="auth-pages.css"/><link rel="stylesheet" href="book-frame.css"/></head><body><main class="auth-shell"><header class="auth-header"><a class="auth-brand" href="library.html"><span class="auth-brand-mark"><i></i><i></i></span><span>GenQuest</span></a><a href="profile.html">Back to profile</a></header><section class="auth-sheet"><aside class="auth-aside"><p><strong>Keep your library secure.</strong>Use a password you do not use elsewhere.</p></aside><section class="auth-content"><p class="auth-kicker">ACCOUNT SECURITY</p><h1>Change password.</h1><p class="auth-lede">Enter your current password, then choose a new one.</p><form class="auth-form"><div class="auth-field"><label for="current">Current password</label><input id="current" type="password" placeholder="Enter your current password"/></div><div class="auth-field"><label for="new">New password</label><input id="new" type="password" placeholder="Enter your new password"/></div><div class="auth-field"><label for="again">Confirm new password</label><input id="again" type="password" placeholder="Confirm your new password"/></div><button class="auth-submit" type="submit">Change password <span>→</span></button></form></section></section></main></body></html>
