<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4ead2" />
  <title>Login - GenQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Inter+Tight:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <header class="site-header auth-header">
    <a class="wordmark" href="index.html" aria-label="GenQuest home">GenQuest</a>
    <a class="back-home" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
  </header>

  <main class="scene login-scene" aria-labelledby="login-title">
    <div class="scene-stage" id="loginSceneStage">
      <div class="scene-canvas login-scene-canvas" id="loginSceneCanvas">
        <img class="scene-plate login-scene-plate" src="assets/login-scene.png" alt="" width="1672" height="941" fetchpriority="high" />

        <section class="login-plane" id="loginPlane">
          <form class="login-form" action="stories.html" method="get">
            <p class="login-kicker">Welcome back</p>
            <div class="login-ornament" aria-hidden="true"><span></span><b>✥</b><span></span></div>
            <h1 id="login-title">Login</h1>
            <p class="login-lede">Enter your email below to<br />login to your account</p>

            <div class="login-field">
              <label for="email">Email</label>
              <div class="login-control">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3.5 5.5h17v13h-17zM4 6l8 7 8-7" /></svg>
                <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required />
              </div>
            </div>

            <div class="login-field">
              <div class="login-field-row">
                <label for="password">Password</label>
                <span>Forgot your password?</span>
              </div>
              <div class="login-control">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v10H5z" /></svg>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
                <button class="password-toggle" type="button" aria-controls="password" aria-label="Show password">Show</button>
              </div>
            </div>

            <button class="login-submit" type="submit"><span aria-hidden="true">❧</span> Login</button>
          </form>
        </section>

        <p class="login-caption">Your story is waiting.</p>
      </div>
    </div>

    <section class="login-mobile-card">
      <form class="login-form" action="stories.html" method="get">
        <p class="login-kicker">Welcome back</p>
        <h1>Login</h1>
        <p class="login-lede">Enter your email below to login to your account.</p>
        <div class="login-field">
          <label for="mobile-email">Email</label>
          <div class="login-control"><input id="mobile-email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required /></div>
        </div>
        <div class="login-field">
          <div class="login-field-row">
            <label for="mobile-password">Password</label>
            <span>Forgot your password?</span>
          </div>
          <div class="login-control"><input id="mobile-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required /></div>
        </div>
        <button class="login-submit" type="submit">Login</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>© 2026 GenQuest</span>
    <nav class="footer-links" aria-label="Legal">
      <span>Terms of Service</span>
      <span>Privacy Policy</span>
    </nav>
  </footer>

  <script src="login-perspective.js?v=20260718-12"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js"></script>
<!-- impeccable-live-end -->
</body>
</html>
